services:
  portfolio:
    container_name: jorge-portfolio
    image: jorge-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Estas variables se leen del archivo .env (en la raíz del proyecto)
      # y se inyectan en el build, ya que NEXT_PUBLIC_* son de tiempo de build.
      args:
        NEXT_PUBLIC_APPLICATION_ID: ${NEXT_PUBLIC_APPLICATION_ID:-}
        NEXT_PUBLIC_JS_KEY: ${NEXT_PUBLIC_JS_KEY:-}
        NEXT_PUBLIC_MASTER_KEY: ${NEXT_PUBLIC_MASTER_KEY:-}
        NEXT_PUBLIC_GEMINI_API_KEY: ${NEXT_PUBLIC_GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
